<!doctype html><meta charset="utf-8"><title>Rust tiny UI</title>
<style>body{background:#111b22;color:#e5f7ed;font:16px system-ui;display:grid;place-content:center;min-height:95vh;margin:0}canvas{width:640px;max-width:90vw;image-rendering:pixelated;touch-action:none;border:1px solid #38705b;border-radius:8px}p{max-width:640px;color:#b2cbbf}a{color:#80e5b0}</style>
<h2>Rust 无堆 UI · 滑条与按钮</h2><canvas width="320" height="240" tabindex="0"></canvas><p>拖动滑条；点击按钮重置。Tab 切换焦点，左右键调节数值，Enter / 空格按下与松开按钮。界面像素由 Rust / embedded-graphics 绘制，浏览器只显示和转发输入。</p><p id="status">正在连接…</p>
<script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),status=document.querySelector('#status');let chain=Promise.resolve(),pointer=null;const activationKeys=new Set();
function send(event){chain=chain.then(async()=>{const r=await fetch(event?'/event?'+new URLSearchParams(event):'/frame');const data=new Uint8ClampedArray(await r.arrayBuffer());if(data.length!==320*240*4)throw Error('Invalid frame');ctx.putImageData(new ImageData(data,320,240),0,0);status.textContent='核心 no_std · 无 alloc · RGB565 · 局部重绘';}).catch(e=>{status.textContent='连接失败：'+e.message;});}
function pos(e){const r=c.getBoundingClientRect();return {x:Math.round((e.clientX-r.left)*320/r.width),y:Math.round((e.clientY-r.top)*240/r.height)};}
c.onpointerdown=e=>{if(pointer!==null||e.button!==0)return;pointer=e.pointerId;c.focus();c.setPointerCapture(pointer);send({kind:'down',...pos(e)});e.preventDefault();};
c.onpointermove=e=>{if(e.pointerId===pointer)send({kind:'move',...pos(e)});};
c.onpointerup=e=>{if(e.pointerId!==pointer)return;send({kind:'up',...pos(e)});pointer=null;};
c.onpointercancel=()=>{pointer=null;send({kind:'cancel'});};c.onlostpointercapture=()=>{if(pointer!==null){pointer=null;send({kind:'cancel'});}};
function cancel(){pointer=null;activationKeys.clear();send({kind:'cancel'});}window.onblur=cancel;c.onblur=cancel;
function key(e,kind){let k={ArrowLeft:'left',ArrowRight:'right',Enter:'activate',' ':'activate',Tab:e.shiftKey?'previous':'next'}[e.key];if(!k)return;e.preventDefault();if(e.repeat&&k!=='left'&&k!=='right')return;if(k==='activate'){if(kind==='keydown'){activationKeys.add(e.code);if(activationKeys.size>1)return;}else{if(!activationKeys.delete(e.code)||activationKeys.size>0)return;}}send({kind,key:k});}
c.onkeydown=e=>key(e,'keydown');c.onkeyup=e=>key(e,'keyup');send();c.focus();
</script>
