[package]
edition = "2024"
name = "waveshare_p4_eth"
rust-version = "1.91"
version = "0.1.0"

[dependencies]
embedded-graphics = "0.8.1"
critical-section = "1.2.0"
esp-hal = { version = "=1.2.0", default-features = false, features = [
    "esp32p4",
    "rt",
    "unstable",
] }
esp-println = { version = "=0.18.0", default-features = false, features = [
    "esp32p4",
    "uart",
    "log-04",
] }
embassy-executor = { version = "0.9.1", features = [
    "arch-riscv32",
    "executor-thread",
] }
embassy-net = { version = "0.9.1", default-features = false, features = [
    "auto-icmp-echo-reply",
    "log",
    "medium-ethernet",
    "multicast",
    "proto-ipv4",
    "udp",
    "dhcpv4",
    "dns",
] }
embassy-time = { version = "0.5.1", default-features = false }
esp-p4-eth = { version = "0.1.0", default-features = false, features = [
    "embassy-net-icmp",
    "embassy-net-udp",
    "p4-time-driver",
] }
heapless = { version = "0.9.3", default-features = false }
log = "0.4.33"
panic-halt = "1.0.0"
riscv = "0.15.0"
riscv-rt = { version = "0.16.0", features = ["device", "memory"] }
static_cell = "2.1.1"
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32p4"] }
embassy-usb = { version = "0.5", default-features = false }
embassy-futures = "0.1.2"
esp-storage = { version = "=0.10.0", features = ["esp32p4"] }
embassy-net-esp-hosted = { git = "https://github.com/embassy-rs/embassy", rev = "cd5f2d0e695e69fa474bda27710094d91bd93aa4", features = ["esp-hosted-mcu", "log", "bluetooth"] }
embassy-net-driver = "0.2.0"
xarxa-driver = { git = "https://github.com/embassy-rs/xarxa", rev = "8f6f33b131deb9ff3290e0e01079537e1ed7b2ad" }
bt-hci-transport = "0.1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
aligned = "0.4.3"
sdio = "0.5.1"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
linked_list_allocator = { version = "0.10.5", optional = true }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["slint-ui"]

[[bin]]
name = "slint_demo"
path = "src/bin/slint_demo.rs"
required-features = ["slint-ui"]

# Reuse the application's time driver with the upstream Hosted driver.
[patch."https://github.com/embassy-rs/embassy"]
embassy-time = { version = "=0.5.1" }

[features]
slint-ui = ["dep:slint", "dep:slint-build", "dep:linked_list_allocator"]
verify-radio = ["esp-hal/log-04"]
verify-static = ["verify-radio"]
verify-stop-display = ["verify-static"]
keyboard-low-refresh = []
usb-trace = ["embassy-usb/log", "dep:embassy-usb-synopsys-otg"]

[patch.crates-io]
esp-hal = { path = "vendor/esp-hal" }
embassy-usb-synopsys-otg = { path = "vendor/embassy-usb-synopsys-otg" }

[dependencies.embassy-usb-synopsys-otg]
version = "=0.4.0"
optional = true
features = ["log"]

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 1
