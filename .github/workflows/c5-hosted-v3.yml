name: Build ESP32-C5 ESP-Hosted v3
on:
  push:
    branches: [codex/c5-hosted-v3]
    paths: [.github/workflows/c5-hosted-v3.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: espressif/idf:v6.1
    steps:
      - name: Checkout pinned ESP-Hosted v3 with official Packet fix
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-hosted-mcu
          ref: 18574265e0ef4ef09cb31454e8930fc29ae301c1
          submodules: recursive
          path: esp_hosted
          persist-credentials: false
      - name: Configure and build C5 SDIO Wi-Fi plus BLE
        shell: bash
        run: |
          set -eo pipefail
          . "$IDF_PATH/export.sh"
          cd esp_hosted/examples/bluetooth/esp_hosted_nimble/bleprph_wifi_coex/cp
          cat >> sdkconfig.defaults <<'CONFIG'
          CONFIG_EH_TRANSPORT_CP_SDIO=y
          CONFIG_EH_TRANSPORT_CP_SDIO_MODE_PACKET=y
          CONFIG_EH_TRANSPORT_CP_SDIO_CHECKSUM=y
          CONFIG_EH_TRANSPORT_CP_SDIO_HIGH_SPEED=y
          CONFIG_EH_TRANSPORT_CP_SDIO_PSEND_PSAMPLE=y
          CONFIG_EH_TRANSPORT_CP_SDIO_GPIO_RESET=-1
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG
          idf.py set-target esp32c5
          idf.py build
          python - <<'PY'
          from pathlib import Path
          s = set(Path("sdkconfig").read_text().splitlines())
          expected = [
              'CONFIG_IDF_TARGET="esp32c5"',
              'CONFIG_ESP_HOSTED_CP=y',
              'CONFIG_ESP_HOSTED_CP_FOR_MCU=y',
              'CONFIG_ESP_HOSTED_CP_RPC_V2=y',
              'CONFIG_ESP_HOSTED_CP_FEAT_WIFI=y',
              'CONFIG_ESP_HOSTED_CP_FEAT_BT=y',
              'CONFIG_BT_ENABLED=y',
              'CONFIG_BT_CONTROLLER_ONLY=y',
              'CONFIG_BT_LE_HCI_INTERFACE_USE_RAM=y',
              'CONFIG_EH_TRANSPORT_CP_SDIO=y',
              'CONFIG_EH_TRANSPORT_CP_SDIO_MODE_PACKET=y',
              'CONFIG_EH_TRANSPORT_CP_SDIO_CHECKSUM=y',
              'CONFIG_EH_TRANSPORT_CP_SDIO_GPIO_RESET=-1',
              'CONFIG_EH_TRANSPORT_CP_SDIO_PIN_CLK=9',
              'CONFIG_EH_TRANSPORT_CP_SDIO_PIN_CMD=10',
              'CONFIG_EH_TRANSPORT_CP_SDIO_PIN_D0=8',
              'CONFIG_EH_TRANSPORT_CP_SDIO_PIN_D1=7',
              'CONFIG_EH_TRANSPORT_CP_SDIO_PIN_D2=14',
              'CONFIG_EH_TRANSPORT_CP_SDIO_PIN_D3=13',
              'CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y',
          ]
          missing = [x for x in expected if x not in s]
          assert not missing, missing
          PY
      - name: Package flash images and build provenance
        shell: bash
        run: |
          set -eo pipefail
          . "$IDF_PATH/export.sh"
          export FW_OUT="$GITHUB_WORKSPACE/firmware"
          mkdir -p "$FW_OUT"
          cd esp_hosted/examples/bluetooth/esp_hosted_nimble/bleprph_wifi_coex/cp
          idf.py merge-bin -o "$FW_OUT/esp-hosted-v3.0.10-packet-fix-esp32c5-sdio-wifi-ble-merged.bin"
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          p = pathlib.Path
          out = p(os.environ["FW_OUT"])
          build = p("build")
          args = json.loads((build / "flasher_args.json").read_text())
          for offset, name in args["flash_files"].items():
              dest = out / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(build / name, dest)
          for name in ("flash_args", "flasher_args.json", "project_description.json"):
              shutil.copy2(build / name, out / name)
          shutil.copy2("sdkconfig", out / "sdkconfig")
          if p("dependencies.lock").exists():
              shutil.copy2("dependencies.lock", out / "dependencies.lock")
          for name in ("sdkconfig.defaults", "sdkconfig.defaults.esp32c5"):
              shutil.copy2(name, out / name)
          app_name = args["app"]["file"]
          shutil.copy2(build / app_name, out / "esp-hosted-v3.0.10-packet-fix-esp32c5-sdio-wifi-ble-app.bin")
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          info = {
              "esp_hosted_version": "3.0.10 + upstream Packet fix (unreleased)",
              "esp_hosted_commit": git("rev-parse", "HEAD"),
              "esp_idf_commit": git("-C", os.environ["IDF_PATH"], "rev-parse", "HEAD"),
              "esp_idf_version": subprocess.check_output(["idf.py", "--version"], text=True).strip(),
              "workflow_run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "target": "esp32c5", "transport": "SDIO", "rpc": "v2", "flash_size": "4MB",
              "features": ["Wi-Fi", "BLE HCI over SDIO"], "sdio_mode": "PACKET", "sdio_checksum": True,
              "tested_on_hardware": False,
          }
          (out / "build-info.json").write_text(json.dumps(info, indent=2) + "\n")
          (out / "README.txt").write_text(
              "ESP32-C5 ESP-Hosted-MCU v3.0.10 + official Packet fix 18574265; SDIO Packet mode + checksum; Wi-Fi + BLE; 4 MB flash layout.\n"
              "Build verified only; not tested on hardware. Requires matching v3 host support.\n"
              "Merged image: flash at 0x0 to the C5, NOT the ESP32-P4.\n"
              "esptool --chip esp32c5 --port PORT write-flash 0x0 esp-hosted-v3.0.10-packet-fix-esp32c5-sdio-wifi-ble-merged.bin\n"
              "App-only image is for a compatible OTA layout, not for flashing at 0x0.\n"
              "Separate images: use offsets in flasher_args.json / flash_args.\n"
              "Waveshare NANO-WIFI6-DB: C5 UART RX=P2-20, TX=P2-22, BOOT=P2-24.\n"
              "Use 3.3V UART levels and common GND; board Type-C connects to P4, not C5.\n"
              "P4 SDIO: D0=14 D1=15 D2=16 D3=17 CLK=18 CMD=19 C5_EN=54.\n"
              "C5 SDIO: D0=8 D1=7 D2=14 D3=13 CLK=9 CMD=10.\n"
          )
          sums = []
          for file in sorted(out.rglob("*")):
              if file.is_file():
                  sums.append(hashlib.sha256(file.read_bytes()).hexdigest() + "  " + str(file.relative_to(out)))
          (out / "SHA256SUMS").write_text("\n".join(sums) + "\n")
          print(json.dumps(info, indent=2))
          PY
          python -m esptool --chip esp32c5 image-info "$FW_OUT/esp-hosted-v3.0.10-packet-fix-esp32c5-sdio-wifi-ble-app.bin"
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-hosted-v3.0.10-packet-fix-esp32c5-sdio-packet-checksum-wifi-ble
          path: firmware/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c5-build-diagnostics
          path: |
            esp_hosted/examples/bluetooth/esp_hosted_nimble/bleprph_wifi_coex/cp/build/log/
            esp_hosted/examples/bluetooth/esp_hosted_nimble/bleprph_wifi_coex/cp/sdkconfig
          if-no-files-found: ignore

