[workspace]
resolver = "2"
members = ["engine/microts-runtime", "engine/core", "engine/drivers", "engine/modules/media", "engine/package", "engine/raster", "engine/render", "engine/runtime", "engine/spec"]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/pocket-nexus/pocketjs"

[workspace.dependencies]
microts = { path = "engine/microts-runtime", version = "0.16.0", default-features = false }
pocketjs-core = { path = "engine/core", version = "0.16.0", default-features = false }
pocket-drivers = { path = "engine/drivers", version = "0.16.0", default-features = false }
pocket-media = { path = "engine/modules/media", version = "0.16.0", default-features = false }
pocket-package = { path = "engine/package", version = "0.16.0", default-features = false }
pocket-raster = { path = "engine/raster", version = "0.16.0", default-features = false }
pocket-render = { path = "engine/render", version = "0.16.0", default-features = false }
pocket-runtime = { path = "engine/runtime", version = "0.16.0", default-features = false }
pocket-spec = { path = "engine/spec", version = "0.16.0", default-features = false }
serde_json = "1"
